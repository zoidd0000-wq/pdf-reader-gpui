[package]
name = "pdf-reader-gpui"
version = "0.1.7"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = "https://github.com/Lej77/pdf-reader-gpui"

[features]
default = []

pdf-js = ["gpui-component/webview", "dep:wry"]
mimalloc = ["dep:mimalloc"]

hotpath = ["dep:hotpath", "hotpath/hotpath"]
hotpath-alloc-bytes-total = ["hotpath/hotpath-alloc-bytes-total"]
hotpath-alloc-count-total = ["hotpath/hotpath-alloc-count-total"]
hotpath-alloc-self = ["hotpath/hotpath-alloc-self"]
hotpath-off = ["hotpath/hotpath-off"]

[dependencies]
anyhow = "1"
image = "0.25.8"

log = {  version = "0.4", features = ["release_max_level_off"] }

rfd = "0.17.0"
raw-window-handle = "0.6.2"

hayro = "0.5.0"
hayro-syntax = "0.5.0"
hayro-interpret = "0.5.0"
kurbo = "0.12.0"

mimalloc = { version = "0.1.48", optional = true }
hotpath = { version = "0.5", optional = true }

[build-dependencies]
winresource = "0.1.20"

[target.'cfg(not(target_family="wasm"))'.dependencies]
gpui = "0.2.2"
gpui-component = { version = "0.5.1" }
wry = { version = "0.53.3", package = "lb-wry", optional = true }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
dirs = "6"

env_logger = "0.11"

[target.'cfg(target_family="wasm")'.dependencies]
gpui-git = { package = "gpui", git = "https://github.com/zed-industries/zed" }
gpui-component-git = { package = "gpui-component", git = "https://github.com/longbridge/gpui-component.git" }
gpui-component-assets-git = { package = "gpui-component-assets", git = "https://github.com/longbridge/gpui-component.git" }
gpui_platform_git = { package = "gpui_platform", git = "https://github.com/zed-industries/zed" }
gpui_web = { package = "gpui_web", git = "https://github.com/zed-industries/zed" }

console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
console_log = "1.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
web-time = "1.1.0"

[profile.dev.package."*"]
opt-level = 3
